name: Publish release
on:
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        options: [latentport, latentport-vllm]
        default: latentport
      destination:
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      publish_images:
        type: boolean
        default: false
        description: Publish GPU-qualified GGUF and BF16 images
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build twine
      - name: Build and check LatentPort
        if: inputs.distribution == 'latentport'
        run: |
          python -m build
          twine check --strict dist/*
          pip install --no-deps --no-index --find-links dist latentport
          python scripts/check_distribution.py
      - name: Build and check the vLLM adapter
        if: inputs.distribution == 'latentport-vllm'
        run: |
          python -m build --wheel --outdir core-dist
          python -m build --outdir dist integrations/vllm
          twine check --strict dist/*
          pip install core-dist/*.whl dist/*.whl
          pip check
          latentport-vllm --help
          python -c 'from importlib.resources import files; assert (files("latentport_vllm") / "patches" / "vllm-0.34.0.patch").is_file()'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.destination == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
  images:
    if: inputs.publish_images && inputs.destination == 'pypi' && inputs.distribution == 'latentport'
    needs: publish
    runs-on: ubuntu-latest
    environment: gpu-release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        backend: [gguf, bf16]
    steps:
      - uses: actions/checkout@v4
      - name: Make room for CUDA image layers on the disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.backend }}
          push: true
          tags: ghcr.io/latentport/latentport:0.4.13-${{ matrix.backend }}-cu128-sm120
          provenance: true
          sbom: true
