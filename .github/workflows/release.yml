name: Publish release
on:
  workflow_dispatch:
    inputs:
      destination:
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      publish_images:
        type: boolean
        default: false
        description: Publish GPU-qualified GGUF and BF16 images
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build twine
      - run: python -m build && twine check dist/*
      - run: pip install --no-deps --no-index --find-links dist latentport
      - run: python scripts/check_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.destination == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
  images:
    if: inputs.publish_images && inputs.destination == 'pypi'
    needs: publish
    runs-on: ubuntu-latest
    environment: gpu-release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        backend: [gguf, bf16]
    steps:
      - uses: actions/checkout@v4
      - name: Make room for CUDA image layers on the disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.backend }}
          push: true
          tags: ghcr.io/latentport/latentport:0.2.1-${{ matrix.backend }}-cu128-sm120
          provenance: true
          sbom: true
