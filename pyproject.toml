[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latentport"
version = "0.1.0"
description = "Programmable full-state transfer between hybrid language models"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "huggingface_hub>=1.33,<2",
  "safetensors>=0.8,<1",
  "numpy>=2.3,<3",
  "torch>=2.11,<3",
  "transformers==5.17.0",
]

[project.optional-dependencies]
reference = ["accelerate>=1.15,<2", "bitsandbytes>=0.50.2,<0.51"]
dev = ["pytest>=8", "build>=1"]
compact = ["accelerate>=1.15,<2", "fla-core==0.6.0", "causal-conv1d==1.7.0"]

[project.scripts]
latentport = "latentport.__main__:main"

[project.urls]
Homepage = "https://latentport.com"
Repository = "https://github.com/LatentPort/latentport"
Documentation = "https://github.com/LatentPort/latentport/tree/main/docs"
Models = "https://huggingface.co/latentport"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latentport = ["configs/*.json"]
