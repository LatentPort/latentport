[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latentport"
version = "0.2.1"
description = "Programmable full-state transfer between hybrid language models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
gguf = [
  "huggingface_hub>=1.33,<2",
  "safetensors>=0.8,<1",
  "numpy>=2.3,<3",
  "torch>=2.11,<3",
  "transformers==5.17.0",
]
bf16 = ["latentport[gguf]", "accelerate>=1.15,<2", "fla-core==0.6.0", "causal-conv1d==1.7.0"]
reference = ["latentport[gguf]", "accelerate>=1.15,<2", "bitsandbytes>=0.50.2,<0.51"]
dev = ["pytest>=8", "build>=1", "twine>=6"]
compact = ["latentport[bf16]"]

[project.scripts]
latentport = "latentport.__main__:main"

[project.urls]
Homepage = "https://latentport.com"
Repository = "https://github.com/LatentPort/latentport"
Documentation = "https://github.com/LatentPort/latentport/tree/main/docs"
Models = "https://huggingface.co/latentport"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latentport = ["configs/*.json", "_demo/web/*"]
