[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latentport-vllm"
version = "0.1.0"
description = "LatentPort attention KV compaction for vLLM"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["latentport==0.4.13", "huggingface-hub>=2", "safetensors>=0.8,<1"]

[project.scripts]
latentport-vllm = "latentport_vllm.cli:main"

[project.urls]
Repository = "https://github.com/LatentPort/latentport"
Documentation = "https://github.com/LatentPort/latentport/tree/main/integrations/vllm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latentport_vllm = ["patches/*.patch"]
